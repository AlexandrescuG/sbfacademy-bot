<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="callback.page_title">SBF Academy — вход через Google</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#FBF6EF;color:#2B2B33;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #box{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;padding:24px;text-align:center;gap:14px}
  .spinner{width:32px;height:32px;border:3px solid #E7DFCF;border-top-color:#C9A227;
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ok{color:#2E7D32;font-size:20px}
  .err{color:#C0392B;font-size:15px}
  .msg{font-size:15px;line-height:1.4;max-width:320px}
</style>
</head>
<body>
  <div id="box">
    <div class="spinner" id="spinner"></div>
    <div class="msg" id="msg" data-i18n="callback.connecting">Завершаем вход через Google…</div>
  </div>
  <script src="i18n.js?v=1"></script>
  <script>
    (async () => {
      const T = window.sbfI18n.t;
      const box = document.getElementById("box");
      const msg = document.getElementById("msg");
      const spinner = document.getElementById("spinner");
      const done = (ok, text) => {
        spinner.remove();
        const icon = document.createElement("div");
        icon.className = ok ? "ok" : "err";
        icon.textContent = ok ? "✓" : "✕";
        box.insertBefore(icon, msg);
        msg.textContent = text;
      };
      // Implicit-флоу Google возвращает токен в hash (#...), не в query —
      // сервер его не видит, поэтому дочитываем и отправляем сами отсюда.
      const params = new URLSearchParams(location.hash.slice(1));
      const idToken = params.get("id_token");
      const state = params.get("state");
      const oauthError = params.get("error");
      if (oauthError) { done(false, T('callback.google_cancelled','Google отменил вход: ') + oauthError); return; }
      if (!idToken || !state) { done(false, T('callback.missing_data','Не удалось получить данные от Google. Попробуйте ещё раз из профиля в Telegram.')); return; }
      try {
        const r = await fetch("/api/auth/google/link-finish", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ state, id_token: idToken }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.detail || T('callback.link_error','Ошибка привязки'));
        done(true, T('callback.success','Google привязан. Вернитесь в Telegram и откройте профиль заново — вкладка сама обновится.'));
      } catch (e) {
        done(false, e.message || T('callback.generic_fail','Не удалось завершить привязку. Попробуйте ещё раз из профиля в Telegram.'));
      }
    })();
  </script>
</body>
</html>
