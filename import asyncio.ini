async def init_db():
    """Создает таблицу для хранения сопоставлений ID сообщений."""
    logger.info("Инициализация базы данных...")
    async with aiosqlite.connect(DB_NAME) as db:
        await db.execute('''
            CREATE TABLE IF NOT EXISTS message_map (
                source_id INTEGER PRIMARY KEY,
                target_id INTEGER
            )
        ''')
        await db.commit()
    logger.info("База данных инициализирована.")

def process_message_text(text: str) -> str:
    """
    Обрабатывает текст сообщения:
    1. Удаляет заданную ссылку (включая /ID) и другие подобные ссылки.
    2. Удаляет квадратные скобки [], которые окружали ссылку.
    3. Обрабатывает ссылки в формате текст(ссылка или ID) - преобразует в [текст](ссылка) или удаляет (ID/пустые скобки).
    4. Всегда добавляет пробел после закрывающей скобки, если его там не было.
    5. Заменяет 'мск' на 'мд'.
    6. Удаляет одиночные символы '*' (не окружённые текстом).
    7. Удаляет ссылку https://max.ru/markettwits и слово 'max' (как отдельное слово).
    8. Удаляет фразы вида "слово(ссылка max.ru)" целиком, включая возможные пробелы.
    9. Удаляет одиночные скобки '(' или ')'.
    10. Сохраняет оригинальные переносы строк и пробелы.
    """
    if not text:
        return text

    # 8. Удаляем фразы вида "слово(ссылка max.ru)" целиком, включая возможные пробелы.
    # ([^\(]+?) - группа 1: один или более символов, НЕ являющихся открывающей скобкой '('.
    #              '+' означает один или более, '?' делает захват 'ленивым', чтобы он останавливался на первом '('.
    #              Это захватит всё слово/фразу перед скобкой, включая '_', если оно есть.
    # \s* - возможные пробелы перед открывающей скобкой '('.
    # \( - литеральная открывающая скобка (экранирована).
    # \s* - возможные пробелы внутри скобки, перед ссылкой.
    # https://max\.ru/ - литеральная часть ссылки.
    # ([^\s\)]*) - группа 2: любые символы, кроме пробела и закрывающей скобки (часть после /).
    # \s* - возможные пробелы внутри скобки, после ссылки.
    # \) - литеральная закрывающая скобка (экранирована).
    # (?=\s|$|[.!?;,]) - позитивный просмотр вперед: после скобки должен быть пробел, конец строки или знак препинания.
    # re.IGNORECASE - делает поиск регистронезависимым.
    processed_text = re.sub(r'([^\(]+?)\s*\(\s*https://max\.ru/([^\s\)]*)\s*\)(?=\s|$|[.!?;,])', '', text, flags=re.IGNORECASE)
    # Если предыдущая операция не изменила текст (re.sub не нашёл совпадений), используем исходный
    if processed_text == text:
        processed_text = text
    text = processed_text

    # 7. Удаляем ссылку https://max.ru.markettwits (и всё, что после /markettwits, если есть)
    # Используем re.sub для более гибкого удаления, включая возможные пробелы вокруг
    # Удаляем https://max.ru и всё, что после до конца слова или пробела
    processed_text = re.sub(r'https://max\.ru/([^\s]*)\s*', '', text, flags=re.IGNORECASE)
    # Если предыдущая операция не изменила текст (re.sub не нашёл совпадений), используем исходный
    if processed_text == text:
        processed_text = text
    text = processed_text

    # 7. Удаляем слово 'max' как отдельное слово (регистронезависимо)
    # \b означает границу слова, чтобы удалить 'max', но не 'максимизация' или 'максимально'
    processed_text = re.sub(r'\bmax\b\s*', '', text, flags=re.IGNORECASE)
    # Если предыдущая операция не изменила текст, используем исходный
    if processed_text == text:
        processed_text = text
    text = processed_text

    # 1. Удаляем основную ссылку markettwits (включая /ID)
    # Исправлено: убраны лишние пробелы из регулярного выражения
    processed_text = re.sub(r'https://t\.me/markettwits(/\d*)?', '', processed_text)

    # 2. Удаляем квадратные скобки, которые окружали ссылку
    processed_text = processed_text.replace('[', '').replace(']', '')
    
    # 3. Обрабатываем ссылки в формате текст(ссылка или ID)
    def replace_parentheses_content(match):
        prefix_word = match.group(1).rstrip() # Слово перед скобкой
        content = match.group(2).strip()      # Содержимое скобок
        
        # Проверяем, является ли содержимое URL
        if content.startswith(('http://', 'https://')):
            # Это ссылка. Применяем эвристику для дублирующихся слов
            display_text = prefix_word
            if len(prefix_word) % 2 == 0:
                half_len = len(prefix_word) // 2
                if prefix_word[:half_len] == prefix_word[half_len:]:
                    display_text = prefix_word[:half_len]
            # Возвращаем ссылку в формате Markdown + гарантированный пробел после
            return f'[{display_text}]({content}) '
            
        elif content.isdigit() and len(content) >= 4:
            # Это похоже на ID, просто убираем скобки и содержимое
            # Применяем эвристику для дублирующихся слов
            display_text = prefix_word
            if len(prefix_word) % 2 == 0:
                half_len = len(prefix_word) // 2
                if prefix_word[:half_len] == prefix_word[half_len:]:
                    display_text = prefix_word[:half_len]
            return f'{display_text} '
        else:
            # Если content пустой или содержит что-то другое (например, только пробелы)
            # Просто убираем скобки и содержимое
            # Применяем эвристику для дублирующихся слов
            display_text = prefix_word
            if len(prefix_word) % 2 == 0:
                half_len = len(prefix_word) // 2
                if prefix_word[:half_len] == prefix_word[half_len:]:
                    display_text = prefix_word[:half_len]
            return f'{display_text} '
            
    # Ищем слово (содержимое)
    processed_text = re.sub(r'([^\s\(]+)\s*\(\s*([^\)]*)\s*\)', replace_parentheses_content, processed_text)

    # 4. Удаляем оставшиеся изолированные ID (теперь только 5 и более цифр)
    processed_text = re.sub(r'(?<=\s)(\d{5,})(?=\s|$)', '', processed_text)
    processed_text = re.sub(r'^(\d{5,})(?=\s|$)', '', processed_text)

    # 5. Заменяем 'мск' на 'мд'
    processed_text = re.sub(r'мск\b', 'мд', processed_text, flags=re.IGNORECASE)

    # 6. Удаляем одиночные символы '*' (не окружённые текстом)
    # Удаляем '*' в начале строки, если за ней НЕ следует непробельный символ
    processed_text = re.sub(r'^\*\s*', '', processed_text)
    # Удаляем '*' в конце строки, если перед ней НЕ предшествует непробельный символ
    processed_text = re.sub(r'\s*\*$', '', processed_text)
    # Удаляем '*' посередине, если они не окружены текстом
    # (?<!\S) - отрицательный ретроспективный просмотр: не preceded by non-whitespace
    # (?!\S) - отрицательный просмотр вперед: not followed by non-whitespace
    processed_text = re.sub(r'(?<!\S)\*(?!\S)', '', processed_text)

    # 9. Удаляем одиночные скобки '(' или ')' и пробелы рядом с ними
    # (?<!\S) - не после непробельного символа
    # (?!\S) - не перед непробельным символом
    processed_text = re.sub(r'(?<!\S)\(\s*(?!\S)', '', processed_text)
    processed_text = re.sub(r'(?<!\S)\s*\)(?!\S)', '', processed_text)
    # Также удаляем одиночные скобки в середине текста, окруженные пробелами
    # \s+ - один или более пробелов
    # \s+\(\s+ - скобка с пробелами с обеих сторон
    processed_text = re.sub(r'\s+\(\s+', ' ', processed_text)
    processed_text = re.sub(r'\s+\)\s+', ' ', processed_text)
    # Убираем лишние пробелы, которые могли образоваться
    processed_text = re.sub(r' {2,}', ' ', processed_text)

    # 10. Убираем двойные пробелы, которые могли появиться
    processed_text = re.sub(r' {2,}', ' ', processed_text)

    # 11. Остальная обработка
    processed_text = processed_text.strip()
    lines = processed_text.splitlines()
    while lines and not lines[0].strip():
        lines.pop(0)
    while lines and not lines[-1].strip():
        lines.pop()
    cleaned_lines = [line.rstrip() for line in lines]
    processed_text = '\n'.join(cleaned_lines)

    return processed_text

def should_exclude(text: str) -> bool:
    """Проверяет, содержит ли текст слова-исключения."""
    if not text:
        return False
    # Используем более строгое вхождение, ищем слова целиком
    text_lower = text.lower()
    for exclusion in EXCLUSIONS:
        if exclusion.lower() in text_lower:
            return True
    return False

async def rewrite_with_llm(text_to_rewrite: str, llm_url: str = LLM_API_URL):
    """Отправляет текст в локальный LLM API и возвращает перефразированный ответ."""
    headers = {"Content-Type": "application/json"}
    data = {
        "model": "", # LM Studio обычно игнорирует это поле
        "messages": [
            {
                "role": "system",
                "content": (
                    "# Role\n"
                    "Ты — ведущий редактор канала SBF Economics, специализирующийся на \"Dark Financial Pulse\". "
                    "Твоя задача — превращать длинные статьи, новости и аналитические отчеты в короткие, жесткие новостные \"молнии\" для Telegram.\n\n"
                    "# Format Rules\n"
                    "Твои посты должны строго соответствовать следующей структуре:\n\n"
                    "1. **HEADER:**\n"
                    "   - Строка начинается с тематического эмодзи (список ниже) + Флаг страны (если касается геополитики/экономики страны).\n"
                    "   - Следом идут хештеги (на русском, lowercase, через #).\n"
                    "   - Пример: ⚠️🇺🇸#сша #геополитика или ✴️#btc #крипто\n\n"
                    "2. **BODY:**\n"
                    "   - Максимальная компрессия смысла. Оставь только суть: \"Что случилось?\" и \"Почему это важно/Сколько это стоит?\".\n"
                    "   - Объем: 1-3 коротких предложения. Разделяй абзацы пустой строкой.\n"
                    "   - Стиль: Телеграфный, сухой, без вводных слов (\"стоит отметить\", \"сообщается что\"). Сразу к делу.\n"
                    "   - Если есть котировки или изменения цен, пиши их в формате: ТИКЕР = ЗНАЧЕНИЕ (или %).\n\n"
                    "3. **FOOTER / ATTRIBUTION:**\n"
                    "   - В конце ключевой мысли или поста укажи источник через длинное тире.\n"
                    "   - Пример: — Bloomberg, — RTRS, — Ъ, — данные Santiment.\n\n"
                    "# Emoji Legend (Используй логику):\n"
                    "- ⚠️ = Тревога, геополитический конфликт, срочное заявление.\n"
                    "- ✴️ = Криптовалюта, DeFi, блокчейн.\n"
                    "- 🛢 = Нефть, газ, энергетика.\n"
                    "- 🌎 = Макроэкономика, глобальные рынки, FX.\n"
                    "- ❗️ = Важная статистика (ВВП, инфляция), отчеты ЦБ.\n"
                    "- 💥 = Прорывы, рекорды, резкие движения.\n\n"
                    "# Constraints\n"
                    "- Язык: Русский.\n"
                    "- Никаких \"Привет, вот саммари\". Сразу выдавай готовый пост.\n"
                    "- Если в тексте есть прямая речь Трампа, Мадуро, главы ЦБ — передавай её максимально близко к тексту, но кратко.\n"
                    "- Сохраняй ссылки из исходника, если они есть, вставляя их в слово-якорь (например: \"...заявил (ссылка)...\").\n\n"
                    "# Input Processing\n"
                    "Текст для обработки:\n"
                )
            },
            {"role": "user", "content": text_to_rewrite}
        ],
        "temperature": 0.7,
        "max_tokens": 500,
        "stream": False  # Убедитесь, что stream=False, если используете стандартный API
    }

    try:
        async with aiohttp.ClientSession() as session:
            async with session.post(f"{llm_url}/v1/chat/completions", json=data, headers=headers) as response:
                if response.status == 200:
                    result = await response.json()
                    # Извлечение сгенерированного текста из ответа
                    rewritten_text = result['choices'][0]['message']['content'].strip()
                    return rewritten_text
                else:
                    logger.error(f"Ошибка API LLM: {response.status}, {await response.text()}")
                    return None
    except Exception as e:
        logger.error(f"Ошибка при обращении к LLM: {e}")
        return None

async def send_to_test_channel(event, rewritten_text, has_media):
    """Отправляет перефразированный текст (и медиа) в тестовый канал."""
    # Проверка: не пустой ли текст
    if not rewritten_text.strip():
        logger.info("Перефразированный текст пуст или содержит только пробелы. Сообщение не отправляется.")
        return None

    max_retries = 3
    for attempt in range(max_retries):
        try:
            # Проверяем, содержит ли сообщение только веб-превью (и, возможно, текст)
            if isinstance(event.message.media, MessageMediaWebPage):
                 # Если есть только веб-превью и текст, отправляем только текст
                 # Это предотвращает ошибку "Cannot use MessageMediaWebPage as file"
                 sent_message = await client.send_message(
                     TEST_CHANNEL_ID, 
                     rewritten_text, 
                     # parse_mode='md', # <-- Отключено
                     link_preview=False  # Уже отключен, но на всякий случай
                 )
            elif has_media:
                # --- НОВАЯ ЛОГИКА: Отправляем только первое подходящее медиа ---
                # Проверяем, есть ли в сообщении реальное медиа (фото, документ)
                # и выбираем первое подходящее для отправки
                media_to_send = None
                # Ищем первое фото
                if event.message.photo:
                    media_to_send = event.message.photo
                elif event.message.document:
                    # Если это документ, проверим, не является ли он видео или фото
                    doc = event.message.document
                    if doc.mime_type:
                        if doc.mime_type.startswith('video/'):
                            media_to_send = doc
                        elif doc.mime_type.startswith('image/'):
                            media_to_send = doc
                        # else: # Это может быть другой тип документа, например, PDF
                        #       # В текущей логике он будет пропущен, если не фото/видео
                    # else: # mime_type может быть None, пропускаем

                if media_to_send:
                    # Отправляем одно медиа с подписью, без превью ссылок
                    sent_message = await client.send_file(
                        TEST_CHANNEL_ID, 
                        file=media_to_send, 
                        caption=rewritten_text or None, 
                        # parse_mode='md', # <-- Отключено
                        link_preview=False  # Отключаем превью ссылок
                    )
                else:
                    # Если подходящее медиа не найдено, отправляем только текст
                    logger.warning(f"Не найдено подходящее медиа для отправки в сообщении {event.message.id}. Отправляем только текст.")
                    sent_message = await client.send_message(
                        TEST_CHANNEL_ID, 
                        rewritten_text, 
                        # parse_mode='md', # <-- Отключено
                        link_preview=False
                    )
            else:
                # Отправляем текстовое сообщение без превью ссылок
                sent_message = await client.send_message(
                    TEST_CHANNEL_ID, 
                    rewritten_text, 
                    # parse_mode='md', # <-- Отключено
                    link_preview=False  # Отключаем превью ссылок
                )
            
            logger.info(f"Отправлено в тестовый канал: {'(с медиа)' if has_media else ''} {'(с веб-превью)' if isinstance(event.message.media, MessageMediaWebPage) else ''} {rewritten_text[:50] if rewritten_text else '(только медиа/превью)'}")
            # Возвращаем объект сообщения, чтобы получить .id
            return sent_message
            
        except FloodWaitError as e:
            logger.warning(f"Флуд-ожидание при отправке: {e.seconds} секунд. Попытка {attempt + 1}/{max_retries}. Ждем...")
            await asyncio.sleep(e.seconds)
            
        except Exception as e:
            logger.error(f"Ошибка при отправке сообщения (попытка {attempt + 1}/{max_retries}): {e}")
            if attempt == max_retries - 1:
                return None
            await asyncio.sleep(2 ** attempt) # Экспоненциальная задержка между повторами

    return None

async def save_mapping(source_id: int, target_id: int):
    """Сохраняет сопоставление ID в базу данных."""
    async with aiosqlite.connect(DB_NAME) as db:
        await db.execute(
            'INSERT OR REPLACE INTO message_map (source_id, target_id) VALUES (?, ?)',
            (source_id, target_id)
        )
        await db.commit()

async def get_target_id(source_id: int) -> int | None:
    """Получает ID сообщения в целевом канале по ID из источника."""
    async with aiosqlite.connect(DB_NAME) as db:
        async with db.execute('SELECT target_id FROM message_map WHERE source_id = ?', (source_id,)) as cursor:
            row = await cursor.fetchone()
            return row[0] if row else None

async def delete_mapping(source_id: int):
    """Удаляет сопоставление ID из базы данных."""
    async with aiosqlite.connect(DB_NAME) as db:
        await db.execute('DELETE FROM message_map WHERE source_id = ?', (source_id,))
        await db.commit()

async def find_missing_messages():
    """Находит пропущенные сообщения в исходном канале."""
    logger.info("Проверка пропущенных сообщений...")
    try:
        # Получаем последние N сообщений из каждого канала
        history_limit = 100
        for channel in SOURCE_CHANNELS:
            logger.info(f"Поиск пропущенных сообщений в {channel}...")
            history = await client.get_messages(channel, limit=history_limit)
            
            # Получаем список всех ID, которые уже есть в базе
            async with aiosqlite.connect(DB_NAME) as db:
                async with db.execute('SELECT source_id FROM message_map') as cursor:
                    saved_ids = set(row[0] for row in await cursor.fetchall())

            missing_messages = []
            for msg in history:
                # Проверяем, что сообщение обычное (не сервисное) и имеет текст или медиа
                if msg.message or msg.photo or msg.video or msg.document:
                    if msg.id not in saved_ids:
                        missing_messages.append(msg)
                        logger.info(f"Найдено пропущенное сообщение в {channel}: {msg.id}")

            # Обратный порядок, чтобы старые сообщения были в начале очереди
            for msg in reversed(missing_messages):
                await missed_messages_queue.put(msg)

        logger.info(f"Найдено {len(missing_messages)} пропущенных сообщений. Добавлены в очередь.")
        
    except Exception as e:
        logger.error(f"Ошибка при поиске пропущенных сообщений: {e}")

async def process_missed_messages():
    """Обрабатывает пропущенные сообщения из очереди по одному раз в 2 минуты."""
    logger.info("Запуск задачи обработки пропущенных сообщений...")
    while not stop_missed_check_task.is_set():
        try:
            # Ждем сообщение из очереди
            event = await asyncio.wait_for(missed_messages_queue.get(), timeout=1.0)
            # Правильный путь к тексту: event.text (а не event.message.text)
            original_message_text = event.text or ""
            # Правильный путь к медиа: event.photo, event.video, event.document
            # Проверяем, есть ли реальное медиа (не WebPage)
            has_real_media = bool(event.photo or (event.document and not isinstance(event.media, MessageMediaWebPage)))
            # Проверяем, есть ли WebPage
            has_webpage = isinstance(event.media, MessageMediaWebPage)
            # has_media теперь означает наличие *реального* медиа или веб-превью
            has_media = has_real_media or has_webpage
            # Правильный путь к ID: event.id
            source_msg_id = event.id

            # Проверка на исключения (на оригинальном тексте)
            # Используем глобально определенную функцию should_exclude
            if should_exclude(original_message_text):
                logger.info(f"Пропущенное сообщение {source_msg_id} пропущено из-за исключения.")
                # Даже пропущенные сообщения нужно отметить, чтобы не проверять их снова
                # Сохраним сопоставление с target_id = -1 как индикатор пропущенного
                await save_mapping(source_msg_id, -1)
                continue

            # Создаём "фейковый" объект event, подходящий для send_to_test_channel
            # Это нужно, потому что send_to_test_channel ожидает event.message
            # Но в пропущенных сообщениях у нас event = msg (объект Message)
            # Создадим атрибут message для совместимости
            class FakeEvent:
                def __init__(self, msg):
                    self.message = msg # Теперь event.message == msg

            fake_event_for_send = FakeEvent(event)

            # Отправка (с обработанным текстом)
            # Передаём fake_event_for_send, которое имеет .message
            sent_message = await send_to_test_channel(fake_event_for_send, original_message_text, has_media)

            # Сохранение сопоставления ID, если отправка прошла успешно
            if sent_message:
                await save_mapping(source_msg_id, sent_message.id)
                logger.info(f"Пропущенное сообщение {source_msg_id} отправлено. Новое сопоставление: {source_msg_id} -> {sent_message.id}")
            else:
                logger.warning(f"Не удалось отправить пропущенное сообщение {source_msg_id}.")

            # Ждем 2 минуты перед следующим сообщением
            if not stop_missed_check_task.is_set():
                 await asyncio.sleep(120) # 2 минуты

        except asyncio.TimeoutError:
            # Очередь пуста, немного подождем и продолжим
            if not stop_missed_check_task.is_set():
                await asyncio.sleep(5)
            continue
        except Exception as e:
            logger.error(f"Ошибка в задаче обработки пропущенных сообщений: {e}")
            if not stop_missed_check_task.is_set():
                await asyncio.sleep(5) # Пауза перед следующей итерацией в случае ошибки

# --- Основная логика ---

async def main():
    """Основная асинхронная функция для запуска клиента и обработчиков."""
    await init_db()
    try:
        logger.info(f"Попытка авторизации для {PHONE}...")
        await client.start(phone=PHONE) # Явно указываем номер телефона
        logger.info(f"Авторизация выполнена для {PHONE}. Мониторинг каналов {SOURCE_CHANNELS} начат...")

        # --- НОВАЯ ЛОГИКА: Проверка пропущенных сообщений ---
        await find_missing_messages()
        # Запускаем задачу обработки пропущенных сообщений
        missed_task = asyncio.create_task(process_missed_messages())
        # --- КОНЕЦ НОВОЙ ЛОГИКИ ---

        @client.on(events.NewMessage(chats=SOURCE_CHANNELS))
        async def new_message_handler(event):
            try:
                logger.debug(f"[Новое сообщение] Получено из {event.chat.username}")
                original_message_text = event.message.text or ""
                # Проверяем наличие любого реального медиа (фото, документы) или веб-превью
                has_real_media = bool(event.message.photo or event.message.document)
                has_webpage = isinstance(event.message.media, MessageMediaWebPage)
                has_media = has_real_media or has_webpage
                source_msg_id = event.message.id

                # Проверка на исключения (на оригинальном тексте)
                if should_exclude(original_message_text):
                    logger.info(f"Сообщение {source_msg_id} из {event.chat.username} пропущено из-за исключения.")
                    # Сохраняем сопоставление с target_id = -1 как индикатор пропущенного
                    await save_mapping(source_msg_id, -1)
                    return

                # --- НОВАЯ ЛОГИКА: Задержка 5 минут и отправка в LLM ---
                logger.info(f"Сообщение {source_msg_id} из {event.chat.username} прошло фильтр. Задержка 5 минут перед отправкой в LLM...")
                await asyncio.sleep(300) # 5 минут

                # Обрабатываем текст перед отправкой в LLM
                message_text = process_message_text(original_message_text)

                # Отправляем в LLM
                logger.info(f"Отправка текста в LLM: {message_text[:100]}...")
                rewritten_text = await rewrite_with_llm(message_text)
                if rewritten_text is None:
                    logger.warning(f"LLM не вернул перефразированный текст для сообщения {source_msg_id}. Сообщение пропущено.")
                    return

                logger.info(f"Текст перефразирован LLM: {rewritten_text[:100]}...")

                # Отправляем перефразированный текст в тестовый канал
                logger.info(f"Отправка перефразированного текста в тестовый канал...")
                sent_message = await send_to_test_channel(event, rewritten_text, has_media)

                # Сохранение сопоставления ID, если отправка прошла успешно
                if sent_message:
                    await save_mapping(source_msg_id, sent_message.id)
                    logger.debug(f"Сопоставление сохранено: источник {source_msg_id} -> цель {sent_message.id}")

            except Exception as e:
                logger.error(f"Ошибка в обработчике нового сообщения: {e}", exc_info=True)

        @client.on(events.MessageEdited(chats=SOURCE_CHANNELS))
        async def edited_message_handler(event):
            try:
                logger.debug(f"[Редактирование] Получено из {event.chat.username}")
                original_message_text = event.message.text or ""
                has_real_media = bool(event.message.photo or event.message.document)
                has_webpage = isinstance(event.message.media, MessageMediaWebPage)
                has_media = has_real_media or has_webpage
                source_msg_id = event.message.id

                # Проверка на исключения (на оригинальном тексте)
                if should_exclude(original_message_text):
                    logger.info(f"Отредактированное сообщение {source_msg_id} из {event.chat.username} содержит исключение. Пропущено/удалено.")
                    # Сохраняем сопоставление с target_id = -1 как индикатор пропущенного
                    await save_mapping(source_msg_id, -1)
                    return

                # --- НОВАЯ ЛОГИКА: Задержка 5 минут и отправка в LLM ---
                logger.info(f"Отредактированное сообщение {source_msg_id} из {event.chat.username} прошло фильтр. Задержка 5 минут перед отправкой в LLM...")
                await asyncio.sleep(300) # 5 минут

                # Обрабатываем текст перед отправкой в LLM
                message_text = process_message_text(original_message_text)

                # Отправляем в LLM
                logger.info(f"Отправка текста в LLM: {message_text[:100]}...")
                rewritten_text = await rewrite_with_llm(message_text)
                if rewritten_text is None:
                    logger.warning(f"LLM не вернул перефразированный текст для отредактированного сообщения {source_msg_id}. Сообщение пропущено.")
                    return

                logger.info(f"Текст перефразирован LLM: {rewritten_text[:100]}...")

                # Отправляем перефразированный текст в тестовый канал
                logger.info(f"Отправка перефразированного текста в тестовый канал...")
                sent_message = await send_to_test_channel(event, rewritten_text, has_media)

                # Сохранение сопоставления ID, если отправка прошла успешно
                if sent_message:
                    await save_mapping(source_msg_id, sent_message.id)
                    logger.debug(f"Сопоставление сохранено: источник {source_msg_id} -> цель {sent_message.id}")

            except Exception as e:
                logger.error(f"Ошибка в обработчике редактирования: {e}", exc_info=True)

        logger.info("Клиент запущен. Ожидание новых сообщений и редактирований...")
        await client.run_until_disconnected()

    except FloodWaitError as e:
        logger.critical(f"Критическое флуд-ожидание при запуске: {e.seconds} секунд.")
    except Exception as e:
        logger.critical(f"Критическая ошибка при авторизации или запуске: {e}", exc_info=True)
    finally:
        # Останавливаем задачу проверки пропущенных сообщений при завершении
        stop_missed_check_task.set()
        try:
            await missed_task
        except asyncio.CancelledError:
            logger.info("Задача обработки пропущенных сообщений остановлена.")

async def run_client():
    """Асинхронная функция для запуска клиента."""
    async with client:
        await main()

# --- Запуск клиента ---
if __name__ == "__main__":
    logger.info("Запуск тестового скрипта...")
    # Используем asyncio.run() для запуска асинхронной функции верхнего уровня
    asyncio.run(run_client())